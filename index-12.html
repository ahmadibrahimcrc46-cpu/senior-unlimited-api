<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SENIOR UNLIMITED - FIXED CLICK</title>
<style>
body{margin:0; background:#0f172a; color:white; font-family:Arial; overscroll-behavior-y: contain;}
.top{background:#0a0f1f; padding:10px 14px; border-bottom:2px solid #facc15; position:sticky; top:0; z-index:20}
.top h1{color:#facc15; font-size:16px; margin:0}
.top p{font-size:10px; color:#94a3b8; margin:0}
.statusBar{display:flex; justify-content:space-between; padding:6px 14px; font-size:10px; background:#0f172a; color:#22c55e}
.navTabs{display:flex; gap:8px; padding:8px 14px; overflow:auto}
.navTabs div{background:#1e293b; border:1px solid #facc15; color:#facc15; padding:7px 18px; border-radius:20px; font-size:13px; font-weight:bold; cursor:pointer}
.navTabs div.active{background:#facc15; color:black}
#pullIndicator{height:0; overflow:hidden; text-align:center; background:#facc15; color:black; font-weight:bold; transition:height 0.2s; display:flex; align-items:center; justify-content:center; font-size:12px}
.dateTabs{display:flex; gap:6px; padding:8px 14px; overflow:auto; background:#0f172a}
.dtab{background:#1e293b; border:1px solid #334155; color:white; padding:7px 16px; border-radius:20px; font-size:12px; cursor:pointer}
.dtab.active{background:#facc15; color:black; font-weight:bold; border-color:#facc15}
.liveBox{background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #facc15; border-radius:12px; padding:14px; margin:10px}
.matchRow{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #334155; cursor:pointer}
.matchRow:active{background:#334155}
.teamCol{display:flex; align-items:center; gap:8px; width:75%}
.teamCol img{width:30px; height:30px; background:white; border-radius:50%; padding:2px}
.scoreBox{background:#facc15; color:black; padding:4px 12px; border-radius:15px; font-weight:bold; font-size:12px; min-width:35px; text-align:center}
</style>
</head>
<body>

<div id="pullIndicator">↓ Jawo don sabuntawa...</div>

<div class="top">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <div><h1>SENIOR UNLIMITED</h1><p>TAP MATCH = WORKS NOW!</p></div>
    <div style="font-size:10px; color:#22c55e">● AUTO UPDATE ON</div>
  </div>
</div>

<div class="statusBar"><span>● LIVE SCORES</span><span id="clock">00:00:00</span><span>ESPN REAL ✅</span></div>

<div class="navTabs">
  <div class="active" id="tabHome">Home</div>
  <div id="tabLeagues">Leagues</div>
  <div id="tabDetail">Match Detail</div>
</div>

<div class="dateTabs">
  <div class="dtab" id="dYesterday">Yesterday</div>
  <div class="dtab active" id="dToday">Today</div>
  <div class="dtab" id="dTomorrow">Tomorrow</div>
</div>

<div class="liveBox">
  <div style="color:#facc15; font-weight:bold; margin-bottom:10px" id="boxTitle">🔥 Tap any match - It will open!</div>
  <div id="listView"></div>
</div>

<script>
// PULL + CLOCK
let startY=0,pulling=false; const ind=document.getElementById('pullIndicator');
window.addEventListener('touchstart',e=>{ if(window.scrollY===0){ startY=e.touches[0].clientY; pulling=true; } });
window.addEventListener('touchmove',e=>{ if(!pulling) return; let d=e.touches[0].clientY-startY; if(d>0&&d<120){ ind.style.height=d+'px'; ind.innerText=d>70?'↻ Saki...':'↓ Jawo...'; } });
window.addEventListener('touchend',e=>{ if(!pulling) return; let d=e.changedTouches[0].clientY-startY; ind.style.height='0px'; pulling=false; if(d>70){ ind.style.height='40px'; ind.innerText='Ana sabuntawa...'; setTimeout(()=>location.reload(true),400); } });
setInterval(()=>{ document.getElementById('clock').innerText=new Date().toLocaleTimeString(); },1000);
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js?v=FINAL16').then(r=>r.update()); }

function getDates(){ const t=new Date(); const y=new Date(); y.setDate(t.getDate()-1); const tom=new Date(); tom.setDate(t.getDate()+1); const fmt=d=>d.toISOString().split('T')[0]; return {yesterday:fmt(y),today:fmt(t),tomorrow:fmt(tom)} }
const leagues=[ {id:'eng.1',name:'English Premier League'}, {id:'esp.1',name:'Spanish LALIGA'}, {id:'ger.1',name:'German Bundesliga'}, {id:'ita.1',name:'Italian Serie A'}, {id:'fra.1',name:'French Ligue 1'}, {id:'eng.2',name:'English Championship'}, {id:'uefa.champions',name:'UCL'} ];
async function fetchESPN(leagueId,dateStr){ try{ const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/scoreboard?dates=${dateStr.replace(/-/g,'')}`,{cache:'no-store'}); const data=await res.json(); return data.events||[] }catch(e){return []} }

let allMatches = [];
let currentView = [];

function goHome(){ document.querySelectorAll('.navTabs div').forEach(b=>b.classList.remove('active')); document.getElementById('tabHome').classList.add('active'); loadDay(currentDay); }
document.getElementById('tabHome').onclick = goHome;
document.getElementById('tabLeagues').onclick = openLeagues;
document.getElementById('tabDetail').onclick = ()=>{ document.getElementById('listView').innerHTML='<div style="padding:30px; text-align:center">Zaɓi wasa daga Home<br><b style="color:#facc15; cursor:pointer" onclick="goHome()">← Koma Home</b></div>'; }
document.getElementById('dYesterday').onclick = function(){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); this.classList.add('active'); loadDay('yesterday'); };
document.getElementById('dToday').onclick = function(){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); this.classList.add('active'); loadDay('today'); };
document.getElementById('dTomorrow').onclick = function(){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); this.classList.add('active'); loadDay('tomorrow'); };

function openLeagues(){
  document.querySelectorAll('.navTabs div').forEach(b=>b.classList.remove('active'));
  document.getElementById('tabLeagues').classList.add('active');
  document.getElementById('boxTitle').innerText="🏆 Leagues - Tap to filter";
  document.getElementById('listView').innerHTML = leagues.map((l,idx)=>`
    <div class="matchRow" data-league-idx="${idx}"><div class="teamCol"><div style="width:32px; height:32px; background:#facc15; border-radius:50%; display:flex; align-items:center; justify-content:center; color:black; font-weight:bold">${l.name[0]}</div><div><div style="font-weight:bold">${l.name}</div><div style="font-size:10px; color:#94a3b8">${l.id}</div></div></div><div style="color:#facc15">→</div></div>
  `).join('');
  // Add listeners for league rows
  setTimeout(()=>{
    document.querySelectorAll('[data-league-idx]').forEach(row=>{
      row.addEventListener('click', ()=>{ const idx=row.getAttribute('data-league-idx'); filterByLeague(leagues[idx].name); });
    });
  },50);
}

function filterByLeague(name){
  goHome();
  setTimeout(()=>{
    const filtered = allMatches.filter(m=>m.league===name);
    document.getElementById('boxTitle').innerText = name + " ("+filtered.length+")";
    renderMatches(filtered);
  },200);
}

function renderMatches(list){
  currentView = list;
  document.getElementById('listView').innerHTML = list.map((m,i)=>`
    <div class="matchRow" data-match-idx="${i}">
      <div class="teamCol"><img src="${m.homeLogo}"><div><div style="font-size:13px; font-weight:bold">${m.home} vs ${m.away}</div><div style="font-size:11px; color:#94a3b8">${m.league} • ${m.time}</div></div></div>
      <div style="display:flex; align-items:center; gap:6px"><img src="${m.awayLogo}" style="width:28px; height:28px; background:white; border-radius:50%; padding:2px"><div class="scoreBox">${m.displayScore}</div></div>
    </div>
  `).join('');
  // FIXED CLICK - add event listeners after render (no more broken onclick string)
  setTimeout(()=>{
    document.querySelectorAll('[data-match-idx]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const idx = row.getAttribute('data-match-idx');
        const mm = currentView[idx];
        showMatchDetail(mm);
      });
    });
  },50);
}

function showMatchDetail(m){
  document.getElementById('boxTitle').innerHTML = `<span style="color:#facc15; cursor:pointer" id="backBtn">← Back</span> ${m.home} vs ${m.away}`;
  document.getElementById('backBtn').onclick = goHome;
  document.getElementById('listView').innerHTML = `
    <div style="background:#0f172a; border-radius:12px; padding:15px; border:1px solid #facc15">
      <div style="text-align:center; font-size:12px; color:#94a3b8">${m.league} • ${m.time}</div>
      <div style="display:flex; justify-content:space-around; margin-top:15px; text-align:center">
        <div><img src="${m.homeLogo}" style="width:50px; height:50px; background:white; border-radius:50%; padding:3px"><div style="font-weight:bold; margin-top:5px">${m.home}</div></div>
        <div style="background:#facc15; color:black; padding:8px 18px; border-radius:20px; font-weight:bold; align-self:center">${m.displayScore}</div>
        <div><img src="${m.awayLogo}" style="width:50px; height:50px; background:white; border-radius:50%; padding:3px"><div style="font-weight:bold; margin-top:5px">${m.away}</div></div>
      </div>
      <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div style="background:#1e293b; padding:10px; border-radius:8px; font-size:11px"><b style="color:#facc15">HOME</b><br><br>GK: Alisson<br>DEF: VVD, Konate<br>MID: Szobo, Mac<br>FWD: Salah, Nunez</div>
        <div style="background:#1e293b; padding:10px; border-radius:8px; font-size:11px"><b style="color:#facc15">AWAY</b><br><br>GK: Raya<br>DEF: Gabriel, Saliba<br>MID: Odegaard<br>FWD: Saka, Jesus</div>
      </div>
      <div style="margin-top:12px; text-align:center"><button onclick="goHome()" style="background:#facc15; color:black; border:none; padding:8px 20px; border-radius:20px; font-weight:bold; cursor:pointer">← Back to Matches</button></div>
    </div>
  `;
}

let currentDay='today';
async function loadDay(day){
  currentDay=day;
  document.getElementById('boxTitle').innerText="Loading "+day+"...";
  const dates=getDates(); const dateStr=dates[day];
  document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center">Loading...</div>';
  let all=[];
  for(let l of leagues){
    const ev=await fetchESPN(l.id,dateStr);
    ev.forEach(e=>{
      const comp=e.competitions[0];
      const isScheduled = comp.status.type.name==='STATUS_SCHEDULED';
      all.push({ league:l.name, home:comp.competitors[0].team.displayName, away:comp.competitors[1].team.displayName, homeLogo:comp.competitors[0].team.logo, awayLogo:comp.competitors[1].team.logo, time:comp.status.type.shortDetail, displayScore: isScheduled? comp.status.type.shortDetail.slice(0,5) : (comp.competitors[0].score+'-'+comp.competitors[1].score) });
    });
  }
  allMatches = all;
  if(all.length===0){ document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center">Babu wasanni a '+day+'</div>'; return; }
  document.getElementById('boxTitle').innerText="🔥 "+all.length+" Matches - Tap any match!";
  renderMatches(all);
}
loadDay('today');
</script>
</body>
</html>
