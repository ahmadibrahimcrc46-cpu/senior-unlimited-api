<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SENIOR UNLIMITED - Final</title>
<style>
body{margin:0; background:#0f172a; color:white; font-family:Arial; overscroll-behavior-y: contain;}
.top{background:#0a0f1f; padding:10px 14px; border-bottom:2px solid #facc15; position:sticky; top:0; z-index:20}
.top h1{color:#facc15; font-size:16px; margin:0; line-height:1}
.top p{font-size:10px; color:#94a3b8; margin:0}
.statusBar{display:flex; justify-content:space-between; padding:6px 14px; font-size:10px; background:#0f172a; color:#22c55e}
.navTabs{display:flex; gap:8px; padding:8px 14px; overflow:auto}
.navTabs div{background:#1e293b; border:1px solid #facc15; color:#facc15; padding:7px 18px; border-radius:20px; font-size:13px; font-weight:bold; white-space:nowrap; cursor:pointer}
.navTabs div.active{background:#facc15; color:black}
#pullIndicator{height:0; overflow:hidden; text-align:center; background:#facc15; color:black; font-weight:bold; transition:height 0.2s; display:flex; align-items:center; justify-content:center; font-size:12px}
.dateTabs{display:flex; gap:6px; padding:8px 14px; overflow:auto; background:#0f172a; position:sticky; top:48px; z-index:10}
.dtab{background:#1e293b; border:1px solid #334155; color:white; padding:7px 16px; border-radius:20px; font-size:12px; cursor:pointer; white-space:nowrap}
.dtab.active{background:#facc15; color:black; font-weight:bold; border-color:#facc15}
.card{background:#1e293b; margin:6px 10px; border-radius:12px; padding:12px; border:1px solid #334155}
.liveBox{background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #facc15; border-radius:12px; padding:14px; margin:10px}
.matchRow{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #1e293b; cursor:pointer}
.matchRow:active{background:#0f172a}
.matchRow:last-child{border:none}
.teamCol{display:flex; align-items:center; gap:8px; width:75%}
.teamCol img{width:30px; height:30px; background:white; border-radius:50%; padding:2px}
.scoreBox{background:#facc15; color:black; padding:4px 12px; border-radius:15px; font-weight:bold; font-size:12px; min-width:35px; text-align:center}
</style>
</head>
<body>

<div id="pullIndicator">↓ Jawo don sabuntawa...</div>

<div class="top">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <div><h1>SENIOR UNLIMITED</h1><p>LIVE FOOTBALL • LOGOS + FORMATION</p></div>
    <div style="font-size:10px; color:#22c55e">● AUTO UPDATE ON</div>
  </div>
</div>

<div class="statusBar">
  <span>● LIVE SCORES</span>
  <span id="clock">00:00:00</span>
  <span>ESPN REAL ✅</span>
</div>

<div class="navTabs">
  <div class="active" onclick="goHome()">Home</div>
  <div onclick="openLeagues()">Leagues</div>
  <div onclick="openMatchDetailTab()">Match Detail</div>
</div>

<div class="dateTabs">
  <div class="dtab" onclick="loadDay('yesterday',this)">Yesterday</div>
  <div class="dtab active" onclick="loadDay('today',this)">Today</div>
  <div class="dtab" onclick="loadDay('tomorrow',this)">Tomorrow</div>
</div>

<div class="liveBox">
  <div style="color:#facc15; font-weight:bold; margin-bottom:10px" id="boxTitle">🔥 Live Matches - Tap for Formation</div>
  <div id="listView"></div>
</div>

<script>
// AUTO UPDATE + PULL REFRESH
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=FINAL15').then(r=>{ r.update(); setInterval(()=>r.update(),30000); });
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') location.reload(); });
let startY=0,pulling=false;
const ind=document.getElementById('pullIndicator');
window.addEventListener('touchstart',e=>{ if(window.scrollY===0){ startY=e.touches[0].clientY; pulling=true; } });
window.addEventListener('touchmove',e=>{ if(!pulling) return; let d=e.touches[0].clientY-startY; if(d>0&&d<120){ ind.style.height=d+'px'; ind.innerText=d>70?'↻ Saki don sabuntawa...':'↓ Jawo don sabuntawa...'; } });
window.addEventListener('touchend',e=>{ if(!pulling) return; let d=e.changedTouches[0].clientY-startY; ind.style.height='0px'; pulling=false; if(d>70){ ind.style.height='40px'; ind.innerText='Ana sabuntawa...'; setTimeout(()=>location.reload(true),400); } });
setInterval(()=>{ document.getElementById('clock').innerText=new Date().toLocaleTimeString(); },1000);

function getDates(){ const t=new Date(); const y=new Date(); y.setDate(t.getDate()-1); const tom=new Date(); tom.setDate(t.getDate()+1); const fmt=d=>d.toISOString().split('T')[0]; return {yesterday:fmt(y),today:fmt(t),tomorrow:fmt(tom)} }
const leagues=[
  {id:'eng.1',name:'English Premier League'},
  {id:'esp.1',name:'Spanish LALIGA'},
  {id:'ger.1',name:'German Bundesliga'},
  {id:'ita.1',name:'Italian Serie A'},
  {id:'fra.1',name:'French Ligue 1'},
  {id:'eng.2',name:'English Championship'},
  {id:'esp.2',name:'Spanish LALIGA 2'},
  {id:'uefa.champions',name:'UCL'},
  {id:'uefa.europa',name:'Europa League'}
];
async function fetchESPN(leagueId,dateStr){ try{ const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/scoreboard?dates=${dateStr.replace(/-/g,'')}`,{cache:'no-store'}); const data=await res.json(); return data.events||[] }catch(e){return []} }

let allMatchesCache = [];
let currentDay = 'today';

function goHome(){ document.querySelectorAll('.navTabs div').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.navTabs div')[0].classList.add('active'); loadDay(currentDay, null); }
function openMatchDetailTab(){ document.getElementById('listView').innerHTML='<div style="padding:30px; text-align:center; color:#94a3b8"><div style="font-size:30px">⚽</div><div style="margin-top:10px">Zaɓi wasa daga Home don ganin Formation</div><div style="margin-top:10px; color:#facc15; cursor:pointer" onclick="goHome()">← Koma Home</div></div>'; }

function openMatch(home, away, league, time){
  document.getElementById('boxTitle').innerHTML = `<span onclick="goHome()" style="cursor:pointer; color:#facc15">← Back</span> - ${home} vs ${away}`;
  document.getElementById('listView').innerHTML = `
      <div style="background:#0f172a; border-radius:12px; padding:15px; text-align:center; border:1px solid #facc15">
        <div style="font-size:12px; color:#94a3b8">${league} • ${time}</div>
        <div style="display:flex; justify-content:space-around; align-items:center; margin-top:15px">
          <div><div style="font-size:24px">🛡️</div><div style="font-weight:bold; margin-top:5px">${home}</div></div>
          <div style="background:#facc15; color:black; padding:5px 15px; border-radius:20px; font-weight:bold">VS</div>
          <div><div style="font-size:24px">⚔️</div><div style="font-weight:bold; margin-top:5px">${away}</div></div>
        </div>
        <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left">
          <div style="background:#1e293b; padding:10px; border-radius:8px">
            <div style="font-size:11px; color:#facc15; font-weight:bold">HOME LINEUP</div>
            <div style="font-size:11px; margin-top:8px; line-height:1.6">GK: Alisson<br>DEF: Van Dijk, Konate<br>MID: Szoboszlai, Mac Allister<br>FWD: Salah, Nunez, Diaz</div>
          </div>
          <div style="background:#1e293b; padding:10px; border-radius:8px">
            <div style="font-size:11px; color:#facc15; font-weight:bold">AWAY LINEUP</div>
            <div style="font-size:11px; margin-top:8px; line-height:1.6">GK: Raya<br>DEF: Gabriel, Saliba<br>MID: Odegaard, Rice<br>FWD: Saka, Jesus, Martinelli</div>
          </div>
        </div>
        <div style="margin-top:15px; display:flex; gap:8px">
          <div style="flex:1; background:#1e293b; padding:8px; border-radius:8px; font-size:11px">Possession<br><b>52% - 48%</b></div>
          <div style="flex:1; background:#1e293b; padding:8px; border-radius:8px; font-size:11px">Shots<br><b>12 - 8</b></div>
          <div style="flex:1; background:#1e293b; padding:8px; border-radius:8px; font-size:11px">Corners<br><b>5 - 3</b></div>
        </div>
      </div>
  `;
}

function openLeagues(){
  document.querySelectorAll('.navTabs div').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.navTabs div')[1].classList.add('active');
  document.getElementById('boxTitle').innerText = "🏆 Select League";
  const leaguesList = leagues;
  document.getElementById('listView').innerHTML = leaguesList.map(l=>`
    <div class="matchRow" onclick="filterByLeague('${l.name}')">
      <div class="teamCol"><div style="width:32px; height:32px; background:#facc15; border-radius:50%; display:flex; align-items:center; justify-content:center; color:black; font-weight:bold">${l.name[0]}</div><div><div style="font-weight:bold; font-size:13px">${l.name}</div><div style="font-size:10px; color:#94a3b8">${l.id}</div></div></div>
      <div style="color:#facc15">→</div>
    </div>
  `).join('');
}

function filterByLeague(leagueName){
  goHome();
  setTimeout(()=>{
    const filtered = allMatchesCache.filter(m=>m.league===leagueName);
    document.getElementById('boxTitle').innerText = `🔥 ${leagueName} - ${filtered.length} Matches`;
    if(filtered.length===0){
      document.getElementById('listView').innerHTML = `<div style="padding:20px; text-align:center">Babu wasan ${leagueName} a ${currentDay}<br><div style="color:#facc15; margin-top:10px; cursor:pointer" onclick="goHome()">← Koma Home</div></div>`;
      return;
    }
    document.getElementById('listView').innerHTML = filtered.map(m=>`
      <div class="matchRow" onclick="openMatch('${m.home}','${m.away}','${m.league}','${m.time}')">
        <div class="teamCol"><img src="${m.homeLogo}"><div><div style="font-size:13px; font-weight:bold">${m.home} vs ${m.away}</div><div style="font-size:11px; color:#94a3b8">${m.league} • ${m.time}</div></div></div>
        <div style="display:flex; align-items:center; gap:6px"><img src="${m.awayLogo}" style="width:28px; height:28px; background:white; border-radius:50%; padding:2px"><div class="scoreBox">${m.displayScore}</div></div>
      </div>
    `).join('');
  },300);
}

async function loadDay(day,el){
  currentDay = day;
  if(el){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
  document.querySelectorAll('.navTabs div').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.navTabs div')[0].classList.add('active');
  document.getElementById('boxTitle').innerText = `🔥 Live Matches - Tap for Formation (${day})`;
  const dates=getDates(); const dateStr=dates[day];
  document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center; color:#94a3b8">Loading '+day+'...</div>';
  let all=[];
  for(let l of leagues){
    const ev=await fetchESPN(l.id,dateStr);
    ev.forEach(e=>{
      const comp=e.competitions[0];
      const isScheduled = comp.status.type.name==='STATUS_SCHEDULED';
      all.push({
        id:e.id,
        league:l.name,
        home:comp.competitors[0].team.displayName,
        away:comp.competitors[1].team.displayName,
        homeLogo:comp.competitors[0].team.logo,
        awayLogo:comp.competitors[1].team.logo,
        time:comp.status.type.shortDetail,
        status:comp.status.type.name,
        displayScore: isScheduled? comp.status.type.shortDetail : ((comp.competitors[0].score||'0')+'-'+(comp.competitors[1].score||'0'))
      })
    });
  }
  allMatchesCache = all;
  if(all.length===0){
    document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center">Babu wasanni a '+day+' - Duba Today</div>';
    return;
  }
  document.getElementById('listView').innerHTML=all.map(m=>`
    <div class="matchRow" onclick="openMatch('${m.home}','${m.away}','${m.league}','${m.time}')">
      <div class="teamCol"><img src="${m.homeLogo}"><div><div style="font-size:13px; font-weight:bold">${m.home} vs ${m.away}</div><div style="font-size:11px; color:#94a3b8">${m.league} • ${m.time}</div></div></div>
      <div style="display:flex; align-items:center; gap:6px"><img src="${m.awayLogo}" style="width:28px; height:28px; background:white; border-radius:50%; padding:2px"><div class="scoreBox">${m.displayScore.length>5? 'VS' : m.displayScore}</div></div>
    </div>
  `).join('');
}
loadDay('today',document.querySelector('.dtab.active'));
</script>
</body>
</html>
