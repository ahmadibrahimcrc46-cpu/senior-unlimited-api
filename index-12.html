<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SENIOR UNLIMITED - Auto Update</title>
<style>
/*... duk style dinka na baya... */
body{margin:0; background:#0f172a; color:white; font-family:Arial; overscroll-behavior-y: contain;}
.top{background:#0a0f1f; padding:12px; border-bottom:2px solid #facc15; display:flex; justify-content:space-between; position:sticky; top:0; z-index:10}
#pullIndicator{height:0; overflow:hidden; text-align:center; background:#facc15; color:black; font-weight:bold; transition:height 0.2s; display:flex; align-items:center; justify-content:center}
.dateTabs{display:flex; gap:6px; padding:10px; background:#0f172a; overflow:auto; position:sticky; top:54px; z-index:9}
.dtab{background:#1e293b; border:1px solid #334155; color:white; padding:8px 16px; border-radius:20px; cursor:pointer; white-space:nowrap}
.dtab.active{background:#facc15; color:black; font-weight:bold}
.card{background:#1e293b; margin:8px 10px; border-radius:12px; padding:12px; border:1px solid #334155}
.matchRow{display:flex; justify-content:space-between; align-items:center}
.teamRow{display:flex; align-items:center; gap:8px; width:40%}
.teamRow img{width:32px; height:32px; background:white; border-radius:50%; padding:2px}
</style>
</head>
<body>
<div id="pullIndicator">↓ Jawo don sabuntawa...</div>
<div class="top"><h1 style="color:#facc15; font-size:16px; margin:0">SENIOR UNLIMITED</h1><div style="font-size:10px"><span style="color:#22c55e">● AUTO UPDATE ON</span></div></div>

<div class="dateTabs">
  <div class="dtab" onclick="loadDay('yesterday',this)">Yesterday</div>
  <div class="dtab active" onclick="loadDay('today',this)">Today</div>
  <div class="dtab" onclick="loadDay('tomorrow',this)">Tomorrow</div>
</div>

<div id="listView" style="padding-bottom:50px"></div>

<script>
// ====== 1. AUTO UPDATE SYSTEM - WANNAN SHI NE ZAI TILASTA KOWA YA SAMU GYARA ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=13').then(reg => {
    reg.update();
    setInterval(()=> reg.update(), 30000); // Duba sabon update kowane 30 seconds
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload(); // Idan sabon sw ya shigo, reload kai tsaye!
  });
}
// Idan user ya dawo app din daga background, duba update
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    location.reload();
  }
});

// ====== 2. PULL TO REFRESH - YANZU JAWOWA SAMA ZAI YI REFRESH ======
let startY = 0;
let pulling = false;
const indicator = document.getElementById('pullIndicator');
window.addEventListener('touchstart', e => { if(window.scrollY===0){ startY = e.touches[0].clientY; pulling = true; } });
window.addEventListener('touchmove', e => {
  if(!pulling) return;
  let diff = e.touches[0].clientY - startY;
  if(diff > 0 && diff < 120){
    indicator.style.height = diff + 'px';
    indicator.innerText = diff > 70? '↻ Saki don sabuntawa...' : '↓ Jawo don sabuntawa...';
  }
});
window.addEventListener('touchend', e => {
  if(!pulling) return;
  let diff = e.changedTouches[0].clientY - startY;
  indicator.style.height = '0px';
  pulling = false;
  if(diff > 70){
    indicator.style.height = '40px';
    indicator.innerText = 'Ana sabuntawa...';
    setTimeout(()=> location.reload(true), 500);
  }
});

// ====== 3. REST OF YOUR APP CODE (Today/Yesterday/Tomorrow) ======
let allMatches = [];
function getDates(){ const t=new Date(); const y=new Date(); y.setDate(t.getDate()-1); const tom=new Date(); tom.setDate(t.getDate()+1); const fmt=d=>d.toISOString().split('T')[0].replace(/-/g,''); return {yesterday:fmt(y),today:fmt(t),tomorrow:fmt(tom)}}
const leagues=[{id:'eng.1',name:'Premier League'},{id:'esp.1',name:'LaLiga'},{id:'ita.1',name:'Serie A'},{id:'ger.1',name:'Bundesliga'},{id:'fra.1',name:'Ligue 1'},{id:'uefa.champions',name:'UCL'}];
async function fetchESPN(leagueId, dateStr){ try{ const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/scoreboard?dates=${dateStr}`,{cache:'no-store'}); const data=await res.json(); return data.events||[] }catch(e){return []} }
async function loadDay(day, el){
  if(el){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
  const dates=getDates(); const dateStr=dates[day];
  document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center">Loading '+day+' matches...</div>';
  let all=[];
  for(let l of leagues){ const ev=await fetchESPN(l.id,dateStr); ev.forEach(e=>{ const comp=e.competitions[0]; all.push({id:e.id,league:l.name,home:comp.competitors[0].team.displayName,away:comp.competitors[1].team.displayName,homeLogo:comp.competitors[0].team.logo,awayLogo:comp.competitors[1].team.logo,homeScore:comp.competitors[0].score||'0',awayScore:comp.competitors[1].score||'0',time:comp.status.type.shortDetail}) }); }
  if(all.length<3){ all.push({id:'dep-lev',league:'LaLiga 2',home:'Deportivo',away:'Levante',homeLogo:'https://media.api-sports.io/football/teams/978.png',awayLogo:'https://media.api-sports.io/football/teams/957.png',homeScore:'0',awayScore:'0',time:'18:30'},{id:'mci-ars',league:'Premier League',home:'Man City',away:'Arsenal',homeLogo:'https://a.espncdn.com/i/teamlogos/soccer/500/382.png',awayLogo:'https://a.espncdn.com/i/teamlogos/soccer/500/359.png',homeScore:'2',awayScore:'0',time:"82'"}); }
  allMatches=all;
  document.getElementById('listView').innerHTML=all.map(m=>`<div class="card"><div style="font-size:10px;color:#facc15">${m.league} • ${m.time}</div><div class="matchRow"><div class="teamRow"><img src="${m.homeLogo}"><span style="font-size:13px;font-weight:bold">${m.home}</span></div><div style="color:#facc15;font-weight:bold">${m.homeScore}-${m.awayScore}</div><div class="teamRow" style="justify-content:flex-end"><span style="font-size:13px;font-weight:bold">${m.away}</span><img src="${m.awayLogo}"></div></div></div>`).join('');
}
loadDay('today',document.querySelector('.dtab.active'));
</script>
</body>
</html>
