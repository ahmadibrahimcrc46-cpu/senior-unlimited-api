<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SENIOR UNLIMITED - Final</title>
<style>
body{margin:0; background:#0f172a; color:white; font-family:Arial; overscroll-behavior-y: contain;}
.top{background:#0a0f1f; padding:10px 14px; border-bottom:2px solid #facc15; position:sticky; top:0; z-index:20}
.top h1{color:#facc15; font-size:16px; margin:0; line-height:1}
.top p{font-size:10px; color:#94a3b8; margin:0}
.statusBar{display:flex; justify-content:space-between; padding:6px 14px; font-size:10px; background:#0f172a; color:#22c55e}
.navTabs{display:flex; gap:8px; padding:8px 14px; overflow:auto}
.navTabs div{background:#1e293b; border:1px solid #facc15; color:#facc15; padding:7px 18px; border-radius:20px; font-size:13px; font-weight:bold; white-space:nowrap}
.navTabs div.active{background:#facc15; color:black}
#pullIndicator{height:0; overflow:hidden; text-align:center; background:#facc15; color:black; font-weight:bold; transition:height 0.2s; display:flex; align-items:center; justify-content:center; font-size:12px}
.dateTabs{display:flex; gap:6px; padding:8px 14px; overflow:auto; background:#0f172a; position:sticky; top:48px; z-index:10}
.dtab{background:#1e293b; border:1px solid #334155; color:white; padding:7px 16px; border-radius:20px; font-size:12px; cursor:pointer; white-space:nowrap}
.dtab.active{background:#facc15; color:black; font-weight:bold; border-color:#facc15}
.card{background:#1e293b; margin:6px 10px; border-radius:12px; padding:12px; border:1px solid #334155}
.liveBox{background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #facc15; border-radius:12px; padding:14px; margin:10px}
.matchRow{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #1e293b}
.matchRow:last-child{border:none}
.teamCol{display:flex; align-items:center; gap:8px; width:40%}
.teamCol img{width:30px; height:30px; background:white; border-radius:50%; padding:2px}
.scoreBox{background:#facc15; color:black; padding:4px 12px; border-radius:15px; font-weight:bold; font-size:12px; min-width:35px; text-align:center}
</style>
</head>
<body>

<div id="pullIndicator">↓ Jawo don sabuntawa...</div>

<div class="top">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <div><h1>SENIOR UNLIMITED</h1><p>LIVE FOOTBALL • LOGOS + FORMATION</p></div>
    <div style="font-size:10px; color:#22c55e">● AUTO UPDATE ON</div>
  </div>
</div>

<div class="statusBar">
  <span>● LIVE SCORES</span>
  <span id="clock">00:00:00</span>
  <span>ESPN REAL ✅</span>
</div>

<div class="navTabs">
  <div class="active">Home</div>
  <div>Leagues</div>
  <div>Match Detail</div>
</div>

<!-- SABON: Yesterday/Today/Tomorrow da kake so -->
<div class="dateTabs">
  <div class="dtab" onclick="loadDay('yesterday',this)">Yesterday</div>
  <div class="dtab active" onclick="loadDay('today',this)">Today</div>
  <div class="dtab" onclick="loadDay('tomorrow',this)">Tomorrow</div>
</div>

<div class="liveBox">
  <div style="color:#facc15; font-weight:bold; margin-bottom:10px">🔥 Live Matches - Tap for Formation</div>
  <div id="listView"></div>
</div>

<script>
// AUTO UPDATE + PULL REFRESH (yana aiki 100%)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=FINAL14').then(r=>{ r.update(); setInterval(()=>r.update(),30000); });
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') location.reload(); });
let startY=0,pulling=false;
const ind=document.getElementById('pullIndicator');
window.addEventListener('touchstart',e=>{ if(window.scrollY===0){ startY=e.touches[0].clientY; pulling=true; } });
window.addEventListener('touchmove',e=>{ if(!pulling) return; let d=e.touches[0].clientY-startY; if(d>0&&d<120){ ind.style.height=d+'px'; ind.innerText=d>70?'↻ Saki don sabuntawa...':'↓ Jawo don sabuntawa...'; } });
window.addEventListener('touchend',e=>{ if(!pulling) return; let d=e.changedTouches[0].clientY-startY; ind.style.height='0px'; pulling=false; if(d>70){ ind.style.height='40px'; ind.innerText='Ana sabuntawa...'; setTimeout(()=>location.reload(true),400); } });
setInterval(()=>{ document.getElementById('clock').innerText=new Date().toLocaleTimeString(); },1000);

// REAL MATCHES - YANZU DA YAWAN WASANNI KAMAR SCREENSHOT DINKA!
function getDates(){ const t=new Date(); const y=new Date(); y.setDate(t.getDate()-1); const tom=new Date(); tom.setDate(t.getDate()+1); const fmt=d=>d.toISOString().split('T')[0]; return {yesterday:fmt(y),today:fmt(t),tomorrow:fmt(tom)} }
const leagues=[
  {id:'eng.1',name:'English Premier League'},
  {id:'esp.1',name:'Spanish LALIGA'},
  {id:'ger.1',name:'German Bundesliga'},
  {id:'ita.1',name:'Italian Serie A'},
  {id:'fra.1',name:'French Ligue 1'},
  {id:'eng.2',name:'English Championship'},
  {id:'esp.2',name:'Spanish LALIGA 2'},
  {id:'uefa.champions',name:'UCL'},
  {id:'uefa.europa',name:'Europa League'}
];
async function fetchESPN(leagueId,dateStr){ try{ const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/scoreboard?dates=${dateStr.replace(/-/g,'')}`,{cache:'no-store'}); const data=await res.json(); return data.events||[] }catch(e){return []} }

async function loadDay(day,el){
  if(el){ document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
  const dates=getDates(); const dateStr=dates[day];
  document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center; color:#94a3b8">Loading '+day+'...</div>';
  let all=[];
  for(let l of leagues){
    const ev=await fetchESPN(l.id,dateStr);
    ev.forEach(e=>{
      const comp=e.competitions[0];
      all.push({
        league:l.name,
        home:comp.competitors[0].team.displayName,
        away:comp.competitors[1].team.displayName,
        homeLogo:comp.competitors[0].team.logo,
        awayLogo:comp.competitors[1].team.logo,
        time:comp.status.type.shortDetail,
        status:comp.status.type.name,
        score:comp.status.type.name==='STATUS_SCHEDULED'? comp.status.type.shortDetail : ((comp.competitors[0].score||'0')+'-'+(comp.competitors[1].score||'0'))
      })
    });
  }
  if(all.length===0){
    document.getElementById('listView').innerHTML='<div style="padding:20px; text-align:center">Babu wasanni a '+day+' - Duba Today</div>';
    return;
  }
  document.getElementById('listView').innerHTML=all.map(m=>`
    <div class="matchRow">
      <div class="teamCol"><img src="${m.homeLogo}"><div><div style="font-size:13px; font-weight:bold">${m.home} vs ${m.away}</div><div style="font-size:11px; color:#94a3b8">${m.league} • ${m.status==='STATUS_SCHEDULED'?'Scheduled':m.time}</div></div></div>
      <div style="display:flex; align-items:center; gap:6px"><img src="${m.awayLogo}" style="width:28px; height:28px; background:white; border-radius:50%; padding:2px"><div class="scoreBox">${m.score.includes(':')? '0-0' : m.score}</div></div>
    </div>
  `).join('');
}
loadDay('today',document.querySelector('.dateTabs.dtab.active'));
</script>
</body>
</html>
