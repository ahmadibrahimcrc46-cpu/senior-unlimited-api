<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Unlimited - LIVE REAL ESPN</title>
<meta name="theme-color" content="#0f172a">
<style>
:root{--primary:#facc15;--bg:#0f172a;--card:#1e293b;--text:#fff}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);padding-bottom:80px}
header{background:#020617;padding:14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--primary);position:sticky;top:0;z-index:10}
header img{width:42px;height:42px;background:var(--primary);border-radius:12px;padding:3px}
.tabs{display:flex;gap:8px;padding:10px;background:#020617;overflow-x:auto;position:sticky;top:71px;z-index:9}
.tabs button{background:var(--card);color:var(--primary);border:1px solid var(--primary);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:bold}
.tabs button.active{background:var(--primary);color:#000}
.page{display:none;padding:10px}.page.active{display:block}
.card{background:var(--card);margin:10px 0;padding:14px;border-radius:14px;border:1px solid #334155}
.match{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #334155}
.score{background:var(--primary);color:#000;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px;text-align:center}
.back-btn{background:none;border:1px solid var(--primary);color:var(--primary);width:32px;height:32px;border-radius:50%;font-size:16px}
.live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<header>
<button class="back-btn" onclick="goBack()">←</button>
<img src="./logo.png.PNG" onerror="this.style.display='none'">
<div><div style="color:var(--primary);font-weight:bold">SENIOR UNLIMITED</div><div style="font-size:10px;color:#94a3b8">INDEX-6 ESPN REAL 100%</div></div>
</header>
<div style="display:flex;justify-content:space-between;padding:5px 10px;color:#22c55e;font-size:11px;font-weight:bold"><span><span class="live-dot"></span> LIVE ESPN REAL</span><span id="clock"></span><span id="api-status">Connecting ESPN...</span></div>
<div class="tabs">
<button class="active" id="b-home" onclick="openPage('home',this)">Home</button>
<button id="b-leagues" onclick="openPage('leagues',this)">Leagues</button>
</div>
<div id="home" class="page active"><div class="card"><h3 style="color:var(--primary)">🔥 Real Live Matches - ESPN</h3><div id="matches">Loading ESPN real data... ⏳</div></div></div>
<div id="leagues" class="page"><div class="card"><h3 style="color:var(--primary)">🏆 Live Leagues</h3><div id="leagues-list">Loading...</div></div></div>
<script>
let historyStack = ['home'];
function openPage(id,btn){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
 if(historyStack[historyStack.length-1]!==id){historyStack.push(id);}
 if(id==='home') loadMatches();
 if(id==='leagues') loadLeagues();
}
function goBack(){ if(historyStack.length>1){historyStack.pop(); let prev=historyStack[historyStack.length-1]; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(prev).classList.add('active');} else {window.location.href='./index-5.html';} }

async function loadMatches(){
 const el=document.getElementById('matches');
 const status=document.getElementById('api-status');
 try{
  status.textContent="Fetching ESPN...";
  // ESPN API - no token, no CORS problem, works 100%
  const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');
  const data = await res.json();
  status.textContent="ESPN REAL ✅";
  let games = data.events || [];
  if(games.length===0){
    // Try all soccer
    const res2 = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard');
    const data2 = await res2.json();
    games = data2.events || [];
  }
  if(games.length===0){
    el.innerHTML="<p>Babu LIVE yanzu a EPL. Amma wannan REAL API ne 100% - baya bukatar Token!</p><p>Gwada Leagues tab.</p>";
  } else {
    el.innerHTML=games.slice(0,20).map(g=>{
      const comp = g.competitions[0];
      const home = comp.competitors[0];
      const away = comp.competitors[1];
      // Swap if home is away
      let h = home.homeAway==='home'?home:away;
      let a = home.homeAway==='away'?home:away;
      const isLive = comp.status.type.state==='in';
      return `<div class="match"><span>${h.team.shortDisplayName} vs ${a.team.shortDisplayName}<br><small style="color:${isLive?'#22c55e':'#94a3b8'}">${isLive?'● LIVE':comp.status.type.shortDetail} • ${g.leagues?g.leagues[0].name:g.name}</small></span><span class="score">${h.score} - ${a.score}<br><small>${comp.status.type.shortDetail}</small></span></div>`;
    }).join('');
  }
  // Also load LaLiga, Bundesliga for more matches
  try{
    const leagues = ['esp.1','ger.1','ita.1','fra.1'];
    let extraHtml="";
    for(let lg of leagues){
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);
      const d = await r.json();
      if(d.events && d.events.length>0){
        extraHtml+=`<h4 style="color:#facc15;margin-top:15px">${d.leagues[0].name}</h4>`;
        extraHtml+=d.events.slice(0,5).map(g=>{
          const comp=g.competitions[0]; const home=comp.competitors[0]; const away=comp.competitors[1];
          let h=home.homeAway==='home'?home:away; let a=home.homeAway==='away'?home:away;
          return `<div class="match"><span>${h.team.shortDisplayName} vs ${a.team.shortDisplayName}</span><span class="score">${h.score}-${a.score}</span></div>`;
        }).join('');
      }
    }
    el.innerHTML+=extraHtml;
  }catch{}
 } catch(e){
  status.textContent="Error "+e.message;
  el.innerHTML=`<p>Error: ${e.message}</p><button onclick="loadMatches()" style="background:#facc15;color:#000;padding:8px 16px;border:none;border-radius:20px;font-weight:bold">Retry</button>`;
 }
}

async function loadLeagues(){
 const el=document.getElementById('leagues-list');
 el.innerHTML="Loading leagues...";
 const leagues = [
   {id:'eng.1',name:'Premier League'},
   {id:'esp.1',name:'LaLiga'},
   {id:'ger.1',name:'Bundesliga'},
   {id:'ita.1',name:'Serie A'},
   {id:'fra.1',name:'Ligue 1'},
   {id:'uefa.champions',name:'Champions League'}
 ];
 let html="";
 for(let lg of leagues){
   try{
     const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.id}/scoreboard`);
     const d=await r.json();
     const count = d.events?d.events.length:0;
     html+=`<div class="match"><span>${lg.name}</span><span class="score">${count} Games Today</span></div>`;
   }catch{ html+=`<div class="match"><span>${lg.name}</span><span class="score">-</span></div>`; }
 }
 el.innerHTML=html;
}
setInterval(()=>{let c=document.getElementById('clock'); if(c) c.innerText=new Date().toLocaleTimeString();},1000);
loadMatches();
</script>
</body>
</html>
