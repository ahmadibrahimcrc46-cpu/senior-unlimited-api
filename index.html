<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreSphere - Live Football</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0}
header{background:#020617;padding:15px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #22c55e}
header img{width:40px;height:40px;border-radius:10px}
.nav{display:flex;gap:10px;padding:10px;background:#020617}
.nav button{background:#1e293b;color:#22c55e;border:none;padding:8px 18px;border-radius:20px;font-weight:bold}
.nav button.active{background:#22c55e;color:black}
.live{color:#22c55e;text-align:center;padding:15px;font-weight:bold}
.card{background:#1e293b;margin:10px;border-radius:12px;padding:15px}
.match{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155}
.odds{display:flex;gap:8px;margin-top:8px}
.odds span{background:#0f172a;border:1px solid #22c55e;padding:4px 10px;border-radius:6px;font-size:12px;color:#22c55e}
.score{background:#0f172a;padding:4px 12px;border-radius:20px;color:#22c55e;font-weight:bold}
</style>
</head>
<body>

<header>
<img src="icon.png" alt="logo">
<h2 style="margin:0;color:#22c55e">ScoreSphere</h2>
</header>

<div class="nav">
<button class="active">HOME</button>
<button>LIVE</button>
<button>TEAMS</button>
<button>ODDS</button>
</div>

<div class="live">● LIVE - Real Time</div>

<div class="card">
<h3 style="color:#22c55e;margin:0 0 10px 0">📅 Today Matches + Betting Odds</h3>

<div class="match">
<div>
<b>Man City vs Arsenal</b>
<div class="odds"><span>1: 2.10</span><span>X: 3.40</span><span>2: 3.20</span></div>
</div>
<div class="score">2-1 | 78'</div>
</div>

<div class="match">
<div>
<b>Barcelona vs Real Madrid</b>
<div class="odds"><span>1: 2.50</span><span>X: 3.60</span><span>2: 2.75</span><span>Over 2.5: 1.85</span></div>
</div>
<div class="score">3-0 | FT</div>
</div>

<div class="match">
<div>
<b>Liverpool vs Chelsea</b>
<div class="odds"><span>1: 1.95</span><span>X: 3.80</span><span>2: 3.90</span></div>
</div>
<div class="score">3-0 | FT</div>
</div>

</div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
