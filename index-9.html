<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Unlimited - Live Football</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="./app-logo.png?v=99">
<link rel="apple-touch-icon" href="./app-logo.png?v=99">
<link rel="apple-touch-icon" sizes="180x180" href="./app-logo.png?v=99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Senior Unlimited">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

:root{--primary:#facc15;--bg:#0f172a;--card:#1e293b;--text:#fff}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);padding-bottom:80px}
header{background:#020617;padding:14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--primary);position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;padding:10px;background:#020617;overflow-x:auto;position:sticky;top:71px;z-index:9}
.tabs button{background:var(--card);color:var(--primary);border:1px solid var(--primary);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:bold}
.tabs button.active{background:var(--primary);color:#000}
.page{display:none;padding:10px}.page.active{display:block}
.card{background:var(--card);margin:10px 0;padding:14px;border-radius:14px;border:1px solid #334155}
.match{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #334155;cursor:pointer}
.match:active{background:#334155}
.match-info{display:flex;align-items:center;gap:10px}
.team-logo{width:28px;height:28px;background:#fff;border-radius:50%;padding:2px;object-fit:contain}
.score{background:var(--primary);color:#000;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px;text-align:center}
.back-btn{background:none;border:1px solid var(--primary);color:var(--primary);width:32px;height:32px;border-radius:50%;font-size:16px}
.formation{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.team-box{background:#0f172a;padding:10px;border-radius:10px;border:1px solid #334155}
.player{padding:4px 0;font-size:13px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between}
.detail-header{background:#020617;padding:15px;border-radius:12px;text-align:center;margin-bottom:10px}
.detail-logos{display:flex;justify-content:space-around;align-items:center}
.detail-logos img{width:60px;height:60px;background:#fff;border-radius:50%;padding:5px;object-fit:contain}
.live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.league-logo{width:24px;height:24px;background:#fff;border-radius:50%;padding:2px}
</style>
</head>
<body>
<header>
<button class="back-btn" onclick="goBack()">←</button>
<div><div style="color:#facc15;font-weight:bold">SENIOR UNLIMITED</div><div style="font-size:10px;color:#94a3b8">LIVE FOOTBALL • LOGOS + FORMATION</div></div>
</header>
<div style="display:flex;justify-content:space-between;padding:5px 10px;color:#22c55e;font-size:11px;font-weight:bold"><span><span class="live-dot"></span> LIVE SCORES</span><span id="clock"></span><span>ESPN REAL ✅</span></div>

<div class="tabs">
<button class="active" id="b-home" onclick="openPage('home')">Home</button>
<button id="b-leagues" onclick="openPage('leagues')">Leagues</button>
<button id="b-detail" onclick="openPage('detail')">Match Detail</button>
</div>

<div id="home" class="page active"><div class="card"><h3 style="color:#facc15">🔥 Live Matches - Tap for Formation</h3><div id="matches">Loading...</div></div></div>
<div id="leagues" class="page"><div class="card"><h3 style="color:#facc15">🏆 Leagues - Tap to View</h3><div id="leagues-list"></div></div></div>
<div id="detail" class="page"><div class="card"><h3 id="detail-title" style="color:#facc15">Match Detail</h3><div id="detail-content">Select a match to view details</div></div></div>
<div id="league-matches" class="page"><div class="card"><h3 id="league-title" style="color:#facc15">League Matches</h3><div id="league-matches-content"></div></div></div>

<script>
let historyStack=['home'];
let teamLogosCache={};

function openPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 let b=document.getElementById('b-'+id); if(b) b.classList.add('active');
 if(historyStack[historyStack.length-1]!==id) historyStack.push(id);
 if(id==='home') loadMatches();
 if(id==='leagues') loadLeagues();
}
function goBack(){
 if(historyStack.length>1){historyStack.pop(); let prev=historyStack[historyStack.length-1]; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(prev).classList.add('active');} else {openPage('home');}
}
function getLogo(team){
 if(team.logos && team.logos[0] && team.logos[0].href) return team.logos[0].href;
 if(team.logo) return team.logo;
 return `https://a.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${team.id}.png&h=80&w=80`;
}

async function loadMatches(){
 const el=document.getElementById('matches'); el.innerHTML="Loading live matches...";
 try{
  const leagues=['eng.1','esp.1','ger.1','ita.1','fra.1','uefa.champions'];
  let allEvents=[];
  for(let lg of leagues){
   try{ const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`); const d=await r.json(); if(d.events) allEvents=allEvents.concat(d.events.map(e=>({...e,_league:lg,_leagueName:d.leagues[0].name}))); }catch{}
  }
  if(allEvents.length===0){ el.innerHTML="No matches today"; return;}
  el.innerHTML=allEvents.slice(0,30).map(g=>{
   const comp=g.competitions[0]; const c1=comp.competitors[0]; const c2=comp.competitors[1];
   let h=c1.homeAway==='home'?c1:c2; let a=c1.homeAway==='away'?c1:c2;
   let hLogo=getLogo(h.team); let aLogo=getLogo(a.team);
   return `<div class="match" onclick="openMatchDetail('${g.id}','${g._league}','${h.team.shortDisplayName} vs ${a.team.shortDisplayName}','${comp.status.type.state}','${h.team.displayName}','${a.team.displayName}','${h.score}','${a.score}','${comp.status.type.shortDetail}','${hLogo}','${aLogo}')">
   <div class="match-info">
   <img src="${hLogo}" class="team-logo" onerror="this.style.display='none'">
   <span>${h.team.shortDisplayName} vs ${a.team.shortDisplayName}<br><small style="color:#94a3b8">${g._leagueName} • ${comp.status.type.shortDetail}</small></span>
   </div>
   <div style="display:flex;align-items:center;gap:6px"><img src="${aLogo}" class="team-logo" onerror="this.style.display='none'"><span class="score">${h.score}-${a.score}</span></div>
   </div>`;
  }).join('');
 }catch(e){ el.innerHTML="Error: "+e.message; }
}

async function loadLeagues(){
 const el=document.getElementById('leagues-list'); el.innerHTML="Loading leagues...";
 const leagues=[
  {id:'eng.1',name:'Premier League',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F23.png&w=40&h=40'},
  {id:'esp.1',name:'LaLiga',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F15.png&w=40&h=40'},
  {id:'ger.1',name:'Bundesliga',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F10.png&w=40&h=40'},
  {id:'ita.1',name:'Serie A',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F12.png&w=40&h=40'},
  {id:'fra.1',name:'Ligue 1',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F9.png&w=40&h=40'},
  {id:'uefa.champions',name:'Champions League',logo:'https://a.espncdn.com/combiner/i?img=%2Fi%2Fleaguelogos%2Fsoccer%2F500%2F2.png&w=40&h=40'}
 ];
 let html="";
 for(let lg of leagues){
  try{
   const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.id}/scoreboard`);
   const d=await r.json(); const count=d.events?d.events.length:0;
   html+=`<div class="match" onclick="openLeague('${lg.id}','${lg.name}')"><div class="match-info"><img src="${lg.logo}" class="league-logo"><span>🏆 ${lg.name}</span></div><span class="score">${count} Games</span></div>`;
  }catch{ html+=`<div class="match" onclick="openLeague('${lg.id}','${lg.name}')"><span>${lg.name}</span><span class="score">View</span></div>`; }
 }
 el.innerHTML=html;
}

async function openLeague(leagueId, leagueName){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('league-matches').classList.add('active');
 document.getElementById('league-title').innerText=leagueName; historyStack.push('league-matches');
 const el=document.getElementById('league-matches-content'); el.innerHTML="Loading "+leagueName+"...";
 try{
  const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/scoreboard`);
  const d=await r.json();
  if(!d.events||d.events.length===0){ el.innerHTML="No matches in "+leagueName+" today"; return;}
  el.innerHTML=d.events.map(g=>{
   const comp=g.competitions[0]; const c1=comp.competitors[0]; const c2=comp.competitors[1];
   let h=c1.homeAway==='home'?c1:c2; let a=c1.homeAway==='away'?c1:c2;
   let hLogo=getLogo(h.team); let aLogo=getLogo(a.team);
   return `<div class="match" onclick="openMatchDetail('${g.id}','${leagueId}','${h.team.shortDisplayName} vs ${a.team.shortDisplayName}','${comp.status.type.state}','${h.team.displayName}','${a.team.displayName}','${h.score}','${a.score}','${comp.status.type.shortDetail}','${hLogo}','${aLogo}')"><div class="match-info"><img src="${hLogo}" class="team-logo" onerror="this.style.display='none'"><span>${h.team.shortDisplayName} vs ${a.team.shortDisplayName}<br><small>${comp.status.type.shortDetail}</small></span></div><span class="score">${h.score}-${a.score}</span></div>`;
  }).join('');
 }catch(e){ el.innerHTML="Error "+e.message; }
}

async function openMatchDetail(eventId, leagueId, title, state, homeName, awayName, homeScore, awayScore, shortDetail, homeLogo, awayLogo){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('detail').classList.add('active'); historyStack.push('detail');
 document.getElementById('detail-title').innerText=title;
 const el=document.getElementById('detail-content');

 let html=`<div class="detail-header">
 <div class="detail-logos">
 <div><img src="${homeLogo}" onerror="this.style.display='none'"><br><b>${homeName}</b><br><span style="font-size:28px;background:#facc15;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold">${homeScore}</span></div>
 <div>VS<br><small style="color:#94a3b8">${shortDetail}<br>${state}</small></div>
 <div><img src="${awayLogo}" onerror="this.style.display='none'"><br><b>${awayName}</b><br><span style="font-size:28px;background:#facc15;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold">${awayScore}</span></div>
 </div>
 </div>`;

 if(state==='pre'){
  html+=`<div style="padding:12px;background:#1e293b;border-radius:10px;border-left:4px solid #facc15">
  <b style="color:#facc15">Match Not Started</b>
  <p style="font-size:13px;line-height:1.5">The match <b>${title}</b> is scheduled. Lineup and formation will be available 1 hour before kick-off.<br><br>
  When the match starts, you will see here:<br>
  ✅ Formation (4-3-3, 4-4-2)<br>
  ✅ Starting XI for both teams<br>
  ✅ Match stats<br>
  ✅ Live commentary</p>
  </div>`;
  el.innerHTML=html; return;
 }

 el.innerHTML=html+`<p>Loading formation and stats... ⏳</p>`;

 try{
  const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueId}/summary?event=${eventId}`);
  const d=await r.json();
  if(d.rosters && d.rosters.length>0){
   html+=`<h4 style="color:#facc15;margin-top:15px">👥 Lineups & Formation</h4><div class="formation">`;
   d.rosters.forEach(team=>{
    let formation = team.formation||'N/A';
    html+=`<div class="team-box"><h5 style="color:#facc15;margin:0 0 8px 0"><img src="${getLogo(team.team)}" style="width:20px;height:20px;vertical-align:middle;background:#fff;border-radius:50%;padding:2px"> ${team.team.displayName} - ${formation}</h5>`;
    if(team.roster){ team.roster.forEach(p=>{ let pos=p.position?p.position.abbreviation:'SUB'; html+=`<div class="player"><span>${p.jersey||''} ${p.athlete.displayName}</span><small style="color:#94a3b8">${pos}</small></div>`; }); }
    html+=`</div>`;
   });
   html+=`</div>`;
  }
  if(d.boxscore && d.boxscore.teams){
   html+=`<h4 style="color:#facc15;margin-top:15px">📊 Stats</h4>`;
   d.boxscore.teams.forEach(t=>{
    html+=`<div class="team-box" style="margin-top:5px"><b><img src="${getLogo(t.team)}" style="width:18px;height:18px;background:#fff;border-radius:50%;padding:1px;vertical-align:middle"> ${t.team.displayName}</b><br>`;
    if(t.statistics){ t.statistics.forEach(s=>{ html+=`<div class="player"><span>${s.displayName}</span><span>${s.displayValue}</span></div>`; }); }
    html+=`</div>`;
   });
  }
  el.innerHTML=html;
 }catch(e){ el.innerHTML=html+`<p style="color:#94a3b8">Could not load lineup: ${e.message}</p>`; }
}
setInterval(()=>{let c=document.getElementById('clock'); if(c) c.innerText=new Date().toLocaleTimeString();},1000);
loadMatches();
</script>
</body>
</html>
