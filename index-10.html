<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Unlimited - Formation</title>
<style>
body{margin:0; font-family:Arial; background:#f0f0f0}
.header{background:white; padding:10px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 5px rgba(0,0,0,.1)}
.header select{padding:8px 12px; border-radius:20px; border:1px solid #ddd; font-weight:bold}
#pitch{background:linear-gradient(180deg,#4CAF50 0%,#388E3C 100%); margin:10px; border-radius:15px; padding:15px 5px 60px 5px; position:relative; min-height:520px; box-shadow:0 4px 15px rgba(0,0,0,.3)}
.line{position:absolute; border:2px solid rgba(255,255,255,.6); left:3%; right:3%; top:2%; bottom:3%; border-radius:4px}
.center-circle{position:absolute; width:80px; height:80px; border:2px solid rgba(255,255,255,.6); border-radius:50%; left:50%; top:0; transform:translateX(-50%)}
.center-line{position:absolute; height:2px; background:rgba(255,255,255,.6); left:3%; right:3%; top:50%}
.penalty-box{position:absolute; width:44%; height:18%; border:2px solid rgba(255,255,255,.6); left:50%; bottom:0; transform:translateX(-50%); border-bottom:none}
.row{display:flex; justify-content:space-around; margin:18px 0; position:relative; z-index:2}
.player{text-align:center; color:white; width:72px}
.player img{width:52px; height:52px; border-radius:50%; border:3px solid white; background:white; object-fit:cover; box-shadow:0 3px 10px rgba(0,0,0,.5)}
.player-name{font-weight:bold; font-size:11px; margin-top:4px; text-shadow:0 1px 3px black; line-height:12px}
.player-num{background:rgba(0,0,0,.5); border-radius:10px; padding:1px 6px; font-size:10px; margin-top:2px; display:inline-block}
.club-title{color:white; text-align:center; font-weight:bold; font-size:18px; text-shadow:0 2px 4px black; margin-bottom:10px; position:relative; z-index:2}
</style>
</head>
<body>

<div class="header">
  <div style="font-weight:bold">⚽ Senior Unlimited</div>
  <select id="clubSelect" onchange="changeClub()">
    <option value="real">Real Madrid</option>
    <option value="barca">Barcelona</option>
    <option value="city">Man City</option>
    <option value="arsenal">Arsenal</option>
    <option value="bayern">Bayern Munich</option>
  </select>
</div>

<div id="pitch">
  <div class="line"></div>
  <div class="center-circle"></div>
  <div class="center-line"></div>
  <div class="penalty-box"></div>
  <div id="formationContent"></div>
</div>

function render(clubKey){
  const club = clubs[clubKey];
  let html = `<div class="club-title">${club.name}</div>`;
  club.players.forEach(row=>{
    html+= `<div class="row">`;
    row.forEach(p=>{
      html+= `<div class="player"><img src="${p.img}" onerror="this.src='https://ui-avatars.com/api/?name=${p.n}&background=random'"><div class="player-name">${p.n}</div><div class="player-num">#${p.num}</div></div>`;
    });
    html+= `</div>`;
  });
  document.getElementById('formationContent').innerHTML = html;
}

function changeClub(){
  const val = document.getElementById('clubSelect').value;
  render(val);
}

// Fara da Real Madrid
render('real');
